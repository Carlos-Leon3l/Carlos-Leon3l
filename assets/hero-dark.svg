<style>.packet{stroke-dasharray:7 16;animation:travel 8s linear infinite}.cursor{animation:blink 1.3s steps(2,end) infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-184}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.packet,.cursor,.pulse{animation:none}}
