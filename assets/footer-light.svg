<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="110" viewBox="0 0 1120 110" role="img" aria-labelledby="title desc">
<title id="title">Vamos conversar sobre dados e software</title><desc id="desc">Identidade visual de Carlos Leonel. Animações decorativas; os desenhos não representam métricas operacionais.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087f66"/><stop offset="1" stop-color="#7048c6"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dce5f1" stroke-width=".7"/></pattern></defs>
<style>.packet{stroke-dasharray:7 16;animation:travel 8s linear infinite}.cursor{animation:blink 1.3s steps(2,end) infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-184}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.packet,.cursor,.pulse{animation:none}}</style>
<rect x="0.5" y="0.5" width="1119" height="109" rx="12" fill="#f6f8fc" stroke="#ccd6e5"/><text x="28" y="43" fill="#087f66" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="22" font-weight="600" >$ connect --data --software</text><text x="28" y="78" fill="#526680" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" >Ideias, projetos e boas conversas sobre tecnologia.</text><rect class="cursor" x="1048" y="39" width="12" height="24" rx="1" fill="#7048c6" stroke="none"/></svg>
